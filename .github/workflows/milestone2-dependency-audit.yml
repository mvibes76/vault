name: Milestone 2 dependency audit

on:
  push:
    branches: [milestone2-security-gate]
    paths:
      - package.json
      - .github/workflows/milestone2-dependency-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone2-security-gate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Regenerate public npm lockfile from scratch
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org || true
      - name: Audit dependencies
        id: audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT_SUMMARY ' + JSON.stringify(v));
          for (const [name, info] of Object.entries(audit.vulnerabilities || {})) {
            console.log('AUDIT_ITEM ' + JSON.stringify({
              name,
              severity: info.severity,
              isDirect: info.isDirect,
              range: info.range,
              nodes: info.nodes,
              via: (info.via || []).map(v => typeof v === 'string' ? v : ({
                source: v.source, name: v.name, severity: v.severity, title: v.title, range: v.range, url: v.url
              }))
            }));
          }
          const blocking = Number(v.high || 0) + Number(v.critical || 0);
          if (blocking > 0) {
            console.error('Blocking high/critical vulnerabilities remain:', blocking);
            process.exit(1);
          }
          NODE
      - name: Install clean dependency graph
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Run tests and production compile
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "vault-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: refresh public npm lockfile"
            git push origin HEAD:milestone2-security-gate
          fi
