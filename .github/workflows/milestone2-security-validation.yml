name: Milestone 2 security validation

on:
  push:
    branches: [milestone2-security-gate]

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-security]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run tests and production compile
        run: npm run build
