name: Vault capture quality
on:
  push:
    branches:
      - feat/chrome-folder-picker-bulk-capture-20261010
  pull_request:
    paths:
      - "extensions/vault-media-capture/**"
      - "app/capture/**"
      - "components/ExtensionCapture.jsx"
      - "lib/capture.js"
      - "tests/**"
      - ".github/workflows/vault-capture.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock=false --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm test
      - name: Lint capture changes
        run: npx eslint app/capture/page.jsx components/ExtensionCapture.jsx lib/capture.js
      - run: npm run build
