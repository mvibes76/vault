name: Media player polish validation

on:
  push:
    branches: [milestone4-5-ui]

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-media]')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_VAULT_UI_V2: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Start local V2
        run: |
          npm start > /tmp/vault-media.log 2>&1 &
          echo $! > /tmp/vault-media.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vault-media.log
          exit 1
      - name: Axe
        run: npx --yes @axe-core/cli http://127.0.0.1:3000/ http://127.0.0.1:3000/library --exit
      - if: always()
        run: kill $(cat /tmp/vault-media.pid) || true
